[tool.poetry]
name = "bot_service"
version = "0.1.0"
description = "Telegram bot service for LLM consultation system"
authors = ["AVolkon"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.scripts]
bot-service = "app.main:main"

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.15.0"
celery = "^5.4.0"
redis = "^5.2.0"
httpx = "^0.28.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-jose = "^3.3.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
