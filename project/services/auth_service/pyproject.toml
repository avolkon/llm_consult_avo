[project]
name = "auth_service"
version = "0.1.0"
description = "Authentication service for LLM consultation system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AVolkon" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "aiosqlite>=0.22.1,<0.23.0",
    "python-multipart>=0.0.27,<0.0.28",
    "slowapi>=0.1.9,<0.2.0",
    "pyjwt>=2.8.0,<3.0.0",
]

[project.scripts]
auth-service = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.8.0,<0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
