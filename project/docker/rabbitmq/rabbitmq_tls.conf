## Узел AMQP по TLS на 5671; plaintext 5672 остаётся для совместимости образа (в production
## подключайте приложение только по amqps — см. валидацию bot_service при ENV=prod).

listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/tls/ca.crt
ssl_options.certfile = /etc/tls/server.crt
ssl_options.keyfile = /etc/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

management.tcp.port = 15672
