services:
  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management

  auth-service:
    build:
      context: ./services/auth_service
    env_file:
      - ./services/auth_service/.env
    ports:
      - "8000:8000"
    command: ["uv", "run", "auth-service"]

  bot-service:
    build:
      context: ./services/bot_service
    env_file:
      - ./services/bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
    command: ["uv", "run", "max-webhook"]

  celery-worker:
    build:
      context: ./services/bot_service
    env_file:
      - ./services/bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    command: ["uv", "run", "celery-llm-worker"]
